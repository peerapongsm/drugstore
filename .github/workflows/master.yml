name: Deploy static site to Pages

on:
  push:
    branches: ["master"]   # or your source branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No Ruby/Jekyll setup needed — just upload your static files
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./   # root of your repo, or ./dist if you build elsewhere

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
